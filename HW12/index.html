<!DOCTYPE html>
<html>
<head>
    <title>ABC Solutions</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <div class="container">
        
       <div class="titles">
        <h4>&#10038; ABC Solutions</h4>
        <h1>SERVICE REQUEST FORM</h1>
       </div>

       <form>

       <h3>Customer Information:</h3>

       <div class="grid">

        <div class="row">
        <label for="name">Customer Name:</label>
        <input type="text" id="name" name="name">
        </div>

        <div class="row">
        <label for="tel">Customer Number:</label>
        <input type="tel" id="tel" name="tel">
        </div>

        <div class="row">
        <label for="address">Home Address:</label>
        <input type="text" id="address" name="address">
        </div>

        <div class="row">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email">
        </div>

       </div>

       <h3>Service Request Details:</h3>

       <label>Requested:</label>

       <div class="row">

       <label for="Requested">Repair</label>
       <input type="radio" id="requested" name="requested" value="Repair">

       <label for="Requested">Maintenance</label>
       <input type="radio" id="requested" name="requested" value="Maintenance">

       <label for="Requested">Installation</label>
       <input type="radio" id="requested" name="requested" value="Installation">

       <label for="Requested">Other</label>
       <input type="radio" id="requested" name="requested" value="Other">
       
       </div>

       <div class="row">
        <label for="service">Description of Service Requested:</label>
        <input type="text" id="service" name="service">
       </div>

       <div class="row">
        <label for="timestamp">Date and Time Requested</label>
        <input type="date" id="timestamp" name="timestamp">
       </div>

       <label>Urgency Level:</label>

       <div class="row">

       <label for="urgency">Low</label>
       <input type="radio" id="urgency" name="urgency" value="Low">

       <label for="urgency">Medium</label>
       <input type="radio" id="urgency" name="urgency" value="Medium">

       <label for="urgency">High</label>
       <input type="radio" id="urgency" name="urgency" value="High">

       <label for="urgency">Emergency</label>
       <input type="radio" id="urgency" name="urgency" value="Emergency">
       
       </div>

       <h3>Approval:</h3>

       <div class="row">
        
       <div class="col">
       <label for="applicant">Applicant Name:</label>
       <input type="text" id="applicant" name="applicant">
       </div>

       <div class="col">
       <label for="submission">Request Submission Date:</label>
       <input type="date" id="submission" name="submission">
       </div>

       </div>

       <h3>Service Personnel:</h3>

       <div class="grid">

        <div class="row">
        <label for="completed">Completed By:</label>
        <input type="text" id="completed" name="completed">
        </div>
        <div class="row">
        <label for="date">Date:</label>
        <input type="date" id="date" name="date">
        </div>

        <div class="row">
        <label for="approved">Approved By:</label>
        <input type="text" id="approved" name="approved">
        </div>

        <div class="row">
        <label for="date">Date:</label>
        <input type="date" id="date" name="date">
        </div>

        </div>

       </form>
    </div>
    
</body>
</html>
